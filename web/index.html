<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!-- A password reset link carries a one-time token in its query string.
         Move it into session storage and out of the address bar before any
         analytics script below records the URL. The reset page reads it from
         there. Keep the key in sync with PASSWORD_RESET_TOKEN_STORAGE_KEY. -->
    <script>
      ;(function () {
        var path = location.pathname.replace(/\/+$/, '')
        if (path !== '/user/reset' && path !== '/reset') return
        var params = new URLSearchParams(location.search)
        var token = params.get('token')
        if (!token) return
        try {
          sessionStorage.setItem('newapi:password-reset-token', token)
        } catch (e) {
          return
        }
        params.delete('token')
        var rest = params.toString()
        history.replaceState(
          history.state,
          '',
          location.pathname + (rest ? '?' + rest : '') + location.hash
        )
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
    <!-- MeowAPI splash. It shows only when the app is not ready after 0.2s
         (0.8s for returning visitors), so quick loads never flash it. Once
         shown, the logo and name always finish (0.5s) and pause (0.15s)
         before src/lib/meow-splash.ts flies the logo into the header.
         Keep the timings in sync with that file. -->
    <style>
      #meow-splash {
        --meow-splash-delay: 0.2s;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #1e1b17;
        opacity: 0;
        pointer-events: none;
        animation: meow-splash-in 0.2s ease-out var(--meow-splash-delay)
          forwards;
      }
      #meow-splash.is-returning {
        --meow-splash-delay: 0.8s;
      }
      #meow-splash.is-shown {
        pointer-events: auto;
      }
      #meow-splash.is-leaving {
        animation: meow-splash-out 0.25s ease-in-out forwards;
      }
      html.dark #meow-splash {
        color: #f3efe8;
      }
      /* The cover is its own layer so the exit can fade it by opacity alone,
         which the GPU animates even while the app is busy. */
      .meow-splash-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        background: #f6eee2;
      }
      html.dark .meow-splash-bg {
        background: #15130f;
      }
      /* 20.5px is the logo's own corner (28 of its 120 units), so the tile
         scaled down by the exit lands with the header logo's corners and no
         radius needs animating. */
      .meow-splash-tile {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 20.5px;
        overflow: hidden;
        opacity: 0;
        animation: meow-splash-pop 0.3s cubic-bezier(0.22, 1, 0.36, 1)
          var(--meow-splash-delay) forwards;
      }
      .meow-splash-tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* A signed-in user's cat, added by src/lib/meow-splash.ts: round like
         the header avatar, it fades in over the logo before the flight. The
         clip-path keeps the circle in Safari while the cat inside moves. */
      .meow-splash-cat {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 50%;
        clip-path: circle(50%);
        opacity: 0;
      }
      .meow-splash-cat img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* "Meow API" in Plus Jakarta Sans 700 as outlines, so it needs no
         font download. Each letter closes in from a wider spacing, then the
         letters dim in turn while the app is still loading: every 1.2s a
         dip (0.3s down, 0.42s back) runs from M to I, 90ms per letter. */
      .meow-splash-word {
        height: 20px;
        overflow: visible;
        fill: currentColor;
      }
      .meow-splash-word g {
        animation: meow-splash-wave 1.2s ease-in-out
          calc(var(--meow-splash-delay) + 0.5s + var(--i) * 90ms) infinite;
      }
      .meow-splash-word path {
        opacity: 0;
        animation: meow-splash-track 0.45s cubic-bezier(0.22, 1, 0.36, 1)
          calc(var(--meow-splash-delay) + 0.05s) forwards;
      }
      @keyframes meow-splash-in {
        to {
          opacity: 1;
        }
      }
      @keyframes meow-splash-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      @keyframes meow-splash-pop {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes meow-splash-track {
        from {
          opacity: 0;
          transform: translateX(var(--s));
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes meow-splash-wave {
        0%,
        60%,
        100% {
          opacity: 1;
        }
        25% {
          opacity: 0.35;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .meow-splash-tile,
        .meow-splash-word path {
          opacity: 1;
          animation: none;
        }
        .meow-splash-word g {
          animation: none;
        }
      }
    </style>
  </head>

    <script>
      // Splash bookkeeping that must run before the app loads: the later
      // reveal for returning visitors (not in the ?meow-splash local
      // preview), when it actually appeared (read by src/lib/meow-splash.ts),
      // and a failsafe if the app never mounts.
      ;(function () {
        var splash = document.getElementById('meow-splash')
        if (!splash) return
        try {
          if (
            localStorage.getItem('meow:splash:v1:seen') &&
            !new URLSearchParams(location.search).has('meow-splash')
          ) {
            splash.classList.add('is-returning')
          }
        } catch (e) {}
        splash.addEventListener('animationstart', function (event) {
          if (event.target !== splash || splash.dataset.shownAt) return
          splash.dataset.shownAt = String(performance.now())
          splash.classList.add('is-shown')
          document.documentElement.classList.add('meow-splash-active')
        })
        setTimeout(function () {
          if (!splash.isConnected || splash.dataset.leaving) return
          splash.dataset.leaving = 'true'
          splash.classList.add('is-leaving')
          document.documentElement.classList.remove('meow-splash-active')
          setTimeout(function () {
            splash.remove()
          }, 250)
        }, 10000)
      })()
    </script>
